[project]
name = "package-orchestrator"
version = "0.1.0"
description = "A package orchestrator for building Docker images from repositories with sequential scripts"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "python-dotenv",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0"
]
[project.scripts]
package = "package_orchestrator.cli:main"
[project.optional-dependencies]
build = ["build>=1.0.0", "twine>=4.0.0"]
dev = [
    "ipykernel>=6.0.0",
    "jupyter>=1.0.0",
    "nbdime>=3.0.0",
    "tqdm>=4.0.0",
    "pre-commit>=3.0.0",
    "docformatter>=1.7.7",
    "pydantic>=2.8.2",
    "loguru",
]
test = [
    "mypy>=1.11.0",
    "pylint>=3.0.0",
    "ruff>=0.6.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.0.0",
]
[project.urls]
"Homepage" = "https://github.com/JENO87/package-orchestrator"
"Repository" = "https://github.com/JENO87/package-orchestrator"
"Issues" = "https://github.com/JENO87/package-orchestrator/issues"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/package_orchestrator/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/package_orchestrator"]

[tool.uv]
package = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true
extra_checks = true
check_untyped_defs = true
disallow_subclassing_any = true
disallow_untyped_decorators = true
disallow_any_generics = true
no_implicit_reexport = true
warn_return_any = true
[[tool.mypy.overrides]]
module = ["package_orchestrator.*"]
ignore_missing_imports = true

[tool.pylint.messages_control]
disable = [
    "import-error",
    "logging-fstring-interpolation",
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
]
max-line-length = 120
fail-under = 9.0

[tool.ruff]
line-length = 120
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "D", "F", "UP", "SIM", "I", "W"]
ignore = [
    "D100", "D101", "D102", "D103", "D104", "D106",
    "D401",
]
[tool.ruff.lint.isort]
known-first-party = ["package_orchestrator"]
combine-as-imports = true
force-single-line = false
[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "--cov=package_orchestrator --cov-report=xml"

[dependency-groups]
test = ["docformatter>=1.7.7"]
