name: CI/CD Pipeline

on:
  push:
    branches: [development]
  pull_request:
    branches: [quality, main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (development, quality, main)'
        required: true
        type: choice
        options: [development, quality, main]
        default: development

env:
  DOCKER_PREFIX: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'development' && 'dev-' || github.event_name == 'pull_request' && 'pr-' || github.ref_name == 'quality' && 'qa-' || github.ref_name == 'main' && '' }}

defaults:
  run:
    shell: bash

jobs:
  install-dependencies:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync
      - name: Editable install
        run: make editable-install

  run-linters:
    name: Run Linters
    runs-on: ubuntu-latest
    needs: [install-dependencies]
    steps:
      - uses: actions/checkout@v4
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync
      - name: Run pre-commit
        run: make pre-commit
      - name: Run linters
        run: make lint

  check-formatting:
    name: Check Formatting
    runs-on: ubuntu-latest
    needs: [install-dependencies]
    steps:
      - uses: actions/checkout@v4
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync
      - name: Check formatting
        run: make format-check

  run-type-checking:
    name: Run Type Checking
    runs-on: ubuntu-latest
    needs: [install-dependencies]
    steps:
      - uses: actions/checkout@v4
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync
      - name: Run type checking
        run: make type-check

  run-unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    needs: [install-dependencies]
    steps:
      - uses: actions/checkout@v4
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync
      - name: Run unit tests
        run: make test

  generate-coverage-report:
    name: Generate Coverage Report
    runs-on: ubuntu-latest
    needs: [run-unit-tests]
    steps:
      - uses: actions/checkout@v4
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync
      - name: Generate coverage report
        run: make test
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            coverage.xml
            report.xml

  build-package:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [install-dependencies, run-linters, check-formatting, run-type-checking, run-unit-tests]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'quality' || github.ref_name == 'main'))
    steps:
      - uses: actions/checkout@v4
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync
      - name: Editable install
        run: make editable-install
      - name: Extract version
        id: get-version
        run: echo "VERSION=$(python -c 'from package_orchestrator import __version__; print(__version__)')" >> $GITHUB_ENV
      - name: Build package
        run: make build-package
      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/*

  export-requirements:
    name: Export Requirements
    runs-on: ubuntu-latest
    needs: [build-package]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'quality' || github.ref_name == 'main'))
    steps:
      - uses: actions/checkout@v4
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync
      - name: Export requirements
        run: make export
      - name: Upload requirements
        uses: actions/upload-artifact@v4
        with:
          name: requirements
          path: requirements.txt

  test-cli:
    name: Test CLI
    runs-on: ubuntu-latest
    needs: [install-dependencies]
    steps:
      - uses: actions/checkout@v4
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync
      - name: Editable install
        run: make editable-install
      - name: Create dummy repo
        run: |
          mkdir dummy-repo
          cd dummy-repo
          echo "def process(): pass" > script1.py
          echo "def report(): pass" > script2.py
          echo "import script1; import script2; script1.process(); script2.report()" > run.py
          echo "pandas>=2.0.0" > requirements.txt
      - name: Test CLI
        run: |
          cd dummy-repo
          python -m package_orchestrator package --registry ghcr.io/JENO87/test --service-name dummy
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_PAT }}

  publish-package:
    name: Publish Package
    runs-on: ubuntu-latest
    needs: [build-package]
    if: github.event_name == 'push' && (github.ref_name == 'quality' || github.ref_name == 'main')
    steps:
      - uses: actions/checkout@v4
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: package
          path: dist/
      - name: Publish to GitHub Packages
        run: make publish-package
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build-package, export-requirements]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'quality' || github.ref_name == 'main'))
    steps:
      - uses: actions/checkout@v4
      - name: Install UV
        run: make install-uv
      - name: Sync dependencies
        run: make sync
      - name: Download requirements
        uses: actions/download-artifact@v4
        with:
          name: requirements
          path: .
      - name: Build Docker image
        run: make build-docker-image
        env:
          DOCKER_TAG: ${{ env.DOCKER_PREFIX }}${{ env.VERSION }}

  tag-docker-image:
    name: Tag Docker Image
    runs-on: ubuntu-latest
    needs: [build-docker-image]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref_name == 'quality' || github.ref_name == 'main'))
    steps:
      - uses: actions/checkout@v4
      - name: Tag Docker image
        run: make tag-docker-image
        env:
          DOCKER_TAG: ${{ env.DOCKER_PREFIX }}${{ env.VERSION }}

  push-docker-image:
    name: Push Docker Image
    runs-on: ubuntu-latest
    needs: [tag-docker-image]
    if: github.event_name == 'push' && (github.ref_name == 'quality' || github.ref_name == 'main')
    steps:
      - uses: actions/checkout@v4
      - name: Login to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ contains(github.event.inputs.environment, 'development') && 'ghcr.io' || github.ref_name == 'quality' && 'ghcr.io' || github.ref_name == 'main' && 'ghcr.io' }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push Docker image
        run: make push-docker-image
        env:
          DOCKER_TAG: ${{ env.DOCKER_PREFIX }}${{ env.VERSION }}

  clean-after-push:
    name: Clean Docker Images
    runs-on: ubuntu-latest
    needs: [push-docker-image]
    if: github.event_name == 'push' && (github.ref_name == 'quality' || github.ref_name == 'main')
    steps:
      - uses: actions/checkout@v4
      - name: Clean Docker images
        run: make clean-docker-image
        env:
          DOCKER_TAG: ${{ env.DOCKER_PREFIX }}${{ env.VERSION }}